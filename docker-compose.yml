services:
  db:
    container_name: db
    image: postgres:18.6-alpine
    environment:
      POSTGRES_SSL_MODE: "disable"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "db"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  tempo:
    container_name: tempo
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC
    networks:
      app_network:
        aliases:
          - tempo.lvh.me

  loki:
    container_name: loki
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      app_network:
        aliases:
          - loki.lvh.me

  promtail:
    container_name: promtail
    image: grafana/promtail:3.0.0
    volumes:
      - ./observability/promtail.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["-config.file=/etc/promtail/config.yaml"]
    networks:
      app_network:
        aliases:
          - promtail.lvh.me

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.51.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      app_network:
        aliases:
          - prometheus.lvh.me

  grafana:
    container_name: grafana
    image: grafana/grafana:10.4.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      app_network:
        aliases:
          - grafana.lvh.me

  app:
    container_name: app
    pid: "host"
    build:
      context: .
    environment:
      GOMAXPROCS: "1"
      APP_NAME: "go-app"
      APP_VERSION: "1.0.0"
      HTTP_PORT: "8080"
      HTTP_USE_PREFORK_MODE: "false"
      LOG_LEVEL: "debug"
      PG_POOL_MAX: "2"
      PG_URL: "postgres://admin:admin@db:5432/db"
      METRICS_ENABLED: "true"
      SWAGGER_ENABLED: "true"
      TRACING_ENABLED: "true"
      TRACING_OTLP_ENDPOINT: "tempo:4317"
      TRACING_OTLP_INSECURE: "true"
      TRACING_SAMPLE_RATE: "1.0"
      JWT_SECRET: "your-secret-key-change-in-production"
      JWT_TOKEN_EXPIRY: "24h"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - tempo
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "2Gb"
        reservations:
          cpus: "0.60"
          memory: "1Gb"
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.8-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me

networks:
  app_network:
    external: false

volumes:
  db_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data: